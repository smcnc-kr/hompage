<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에스엠씨앤씨 | SM Commerce &amp; Consulting</title>
<meta name="description" content="국경을 넘어 기업을 잇는 가교, M&amp;A · 투자유치 전문기업 에스엠씨앤씨">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: advisory-firm site (menu → hero slider → proof → services → deals → reach → CTA), with sub-pages per division. Navy carries the brand; logo green marks "live" states. */
:root{
  --navy:#1E2A5E; --navy-2:#2A3A7A; --green:#4E9470; --orange:#E8892F; --sky:#2E9BD6;
  --bg:#FFFFFF; --bg-2:#F3F5F9; --surface:#FFFFFF; --fg:#141C38; --muted:#5A6684; --line:#DDE3EE;
  --band:#1E2A5E; --band-fg:#F2F5FB; --band-muted:#B3BDD8; --band-line:rgba(255,255,255,.16);
  --accent:#2A4C93; --accent-2:#3F8A63; --field:#FFFFFF; --btn:#1E2A5E; --btn-fg:#FFFFFF; --chip:#FFFFFF;
  --sans:"IBM Plex Sans KR","Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --wrap:1200px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --bg-2:#121A30; --surface:#161E37; --fg:#E7ECF7; --muted:#9DA9C6; --line:#29345A;
  --band:#141D3D; --band-fg:#F2F5FB; --band-muted:#A3AFCF; --band-line:rgba(255,255,255,.12);
  --accent:#86A8E6; --accent-2:#6DBB92; --field:#0F1529; --btn:#86A8E6; --btn-fg:#0D1222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --bg-2:#121A30; --surface:#161E37; --fg:#E7ECF7; --muted:#9DA9C6; --line:#29345A;
  --band:#141D3D; --band-fg:#F2F5FB; --band-muted:#A3AFCF; --band-line:rgba(255,255,255,.12);
  --accent:#86A8E6; --accent-2:#6DBB92; --field:#0F1529; --btn:#86A8E6; --btn-fg:#0D1222; color-scheme:dark}
html:lang(zh-CN) body{font-family:"Noto Sans SC","IBM Plex Sans KR",system-ui,sans-serif}
html:lang(ja) body{font-family:"Noto Sans JP","IBM Plex Sans KR",system-ui,sans-serif}
html:lang(ja) body,html:lang(zh-CN) body{word-break:normal;line-break:strict}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--surface)}
a{color:inherit}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
ul{margin:0}
img{max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,a,input,textarea{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== header / menu ===== */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;background:var(--surface);border-bottom:1px solid var(--line)}
.top .main-row{display:flex;align-items:center;gap:20px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand svg{width:28px;height:32px}
.brand b{font-size:18px;letter-spacing:-.01em;display:block;line-height:1.2}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.04em;line-height:1.1;font-weight:500}
nav.menu{display:flex;align-items:stretch;margin-left:auto;align-self:stretch}
.mi{position:relative;display:flex}
.mi > a,.mi > button{display:flex;align-items:center;gap:6px;text-decoration:none;font:500 15.5px var(--sans);padding:0 16px;border:0;background:none;color:var(--fg);cursor:pointer;border-bottom:2px solid transparent}
.mi > button::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.6}
.mi.on > a,.mi.on > button{border-bottom-color:var(--accent);color:var(--accent)}
.drop{position:absolute;top:100%;left:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-top:0;box-shadow:0 14px 30px rgba(15,25,60,.12);padding:8px;display:none}
.mi:hover .drop,.mi:focus-within .drop,.mi.open .drop{display:grid}
.drop a{text-decoration:none;font-size:14.5px;padding:9px 12px;border-radius:6px;white-space:nowrap}
.drop a:hover,.drop a[aria-current="page"]{background:var(--bg-2);color:var(--accent)}
.util{background:var(--band);color:var(--band-muted)}
.util .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.util-l{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.lang{display:flex;align-items:center;gap:2px;flex-shrink:0}
.lang button{font:500 12.5px var(--sans);border:0;background:none;color:var(--band-muted);padding:4px 10px;border-radius:4px;cursor:pointer;position:relative}
.lang button + button::before{content:"";position:absolute;left:-1px;top:50%;height:10px;margin-top:-5px;width:1px;background:var(--band-line)}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]{color:#fff;font-weight:700}
.lang button[aria-pressed="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:#9FC3AE;border-radius:1px}
.cta-top{flex-shrink:0;text-decoration:none;font-weight:700;font-size:14.5px;background:var(--btn);color:var(--btn-fg);padding:9px 16px;border-radius:7px}
.burger{display:none;margin-left:auto;width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.burger span,.burger span::before,.burger span::after{display:block;width:18px;height:1.6px;background:currentColor;margin:auto;position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}
.mnav{display:none;border-top:1px solid var(--line);background:var(--surface);max-height:calc(100vh - 106px);overflow:auto}
.mnav .wrap{display:grid;gap:18px;padding-block:18px 26px}
.mnav b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.mnav a{display:block;text-decoration:none;font-size:16px;padding:7px 0;font-weight:500}
@media (max-width:1040px){.top .cta-top{display:none}}
@media (max-width:900px){nav.menu{display:none}.burger{display:block}.mnav.open{display:block}}
@media (max-width:1000px){.mi > a,.mi > button{padding:0 11px;font-size:15px}}
@media (max-width:480px){.top .main-row{gap:10px}.brand b{font-size:16px}.burger{width:38px;height:38px}.util-l{display:none}.util .wrap{justify-content:flex-end}.lang button{padding:4px 8px;font-size:12px}}

/* ===== shared blocks ===== */
section.sec{padding-block:88px}
section.sec.tight{padding-block:64px}
.bg2{background:var(--bg-2)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.sec-head > div{display:grid;gap:10px;max-width:46em}
.sec-head h2{font-size:clamp(26px,3.2vw,36px);letter-spacing:-.02em}
.sec-head p{color:var(--muted);font-size:16.5px}
.link-all{text-decoration:none;font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:700 15px var(--sans);padding:12px 22px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.btn.p{background:var(--btn);color:var(--btn-fg)}
.btn.o{border-color:var(--line);color:var(--fg);background:var(--surface)}
.btn.w{background:#F2F5FB;color:#1E2A5E}
.btn.g{border-color:rgba(255,255,255,.4);color:#F2F5FB}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:960px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}section.sec{padding-block:60px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:12px;align-content:start;min-width:0}
.card h3{font-size:20px}
.card p{color:var(--muted);font-size:15px}
.ph{margin:0;position:relative;overflow:hidden;border-radius:10px;background:var(--bg-2);min-width:0}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph.contain img{object-fit:contain;background:#fff}
.ph figcaption{font-size:13px;color:var(--muted);padding:8px 2px 0}
.ph.over figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 9px;color:#fff;background:linear-gradient(transparent,rgba(10,15,35,.78))}
.bul{list-style:none;padding:0;display:grid;gap:7px}
.bul li{position:relative;padding-left:16px;font-size:15px}
.bul li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent-2)}
.tag{display:inline-block;font:500 12px var(--sans);padding:3px 10px;border-radius:999px;background:var(--bg-2);color:var(--accent);border:1px solid var(--line);white-space:nowrap}
.tag.live{background:none;border-color:var(--accent-2);color:var(--accent-2)}

/* ===== home hero slider ===== */
.hero{position:relative;background:var(--band);color:var(--band-fg);overflow:hidden}
.slide{position:relative;display:none}
.slide.on{display:block}
.slide .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
.slide .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--band) 25%,rgba(30,42,94,.35))}
.slide .wrap{position:relative;padding-block:110px;display:grid;gap:22px;justify-items:start}
.slide .eyebrow{color:#9FC3AE}
.slide h1{font-size:clamp(32px,5vw,58px);font-weight:700;letter-spacing:-.025em;max-width:15em;white-space:pre-line}
.slide h1 em{font-style:normal;color:#9FC3AE}
.slide p{font-size:clamp(16px,1.7vw,19px);color:var(--band-muted);max-width:36em}
.slide .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.slide.on .wrap > *{animation:rise .6s both}.slide.on .wrap > *:nth-child(2){animation-delay:.06s}.slide.on .wrap > *:nth-child(3){animation-delay:.12s}.slide.on .wrap > *:nth-child(4){animation-delay:.18s}}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero-ctl{position:absolute;left:0;right:0;bottom:34px}
.hero-ctl .wrap{display:flex;align-items:center;gap:16px}
.hero-ctl .cnt{font:500 13px var(--mono);color:var(--band-muted);min-width:44px}
.hero-ctl .bars{display:flex;gap:6px}
.hero-ctl .bars button{width:44px;height:3px;border:0;padding:0;background:rgba(255,255,255,.25);cursor:pointer;border-radius:2px}
.hero-ctl .bars button[aria-current="true"]{background:#9FC3AE}
.hero-ctl .pp{border:1px solid rgba(255,255,255,.3);background:none;color:#F2F5FB;border-radius:999px;font:500 12px var(--mono);padding:4px 10px;cursor:pointer}
@media (max-width:640px){.slide .wrap{padding-block:72px 96px}}

.stats{background:var(--surface);border-bottom:1px solid var(--line)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:30px 22px;display:grid;gap:2px;min-width:0}
.stat + .stat{border-left:1px solid var(--line)}
.stat strong{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.15;color:var(--navy)}
:root[data-theme="dark"] .stat strong{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat strong{color:var(--fg)}}
.stat strong small{font-size:.45em;font-weight:500;margin-left:3px}
.stat span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.stats .wrap{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}.stat{padding:22px 14px}}

.biz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.biz article{position:relative;border-radius:14px;overflow:hidden;min-height:420px;color:#F2F5FB;display:flex;flex-direction:column;justify-content:flex-end;background:#1E2A5E}
.biz article img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.biz article::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,29,61,.1),rgba(20,29,61,.92) 70%)}
.biz .in{position:relative;padding:30px;display:grid;gap:12px}
.biz .in .eyebrow{color:#9FC3AE}
.biz h3{font-size:26px}
.biz p{color:#C9D2EA;font-size:15px}
.biz .subs{display:grid;gap:0;margin-top:6px;border-top:1px solid rgba(255,255,255,.2)}
.biz .subs a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.2);font-weight:500}
.biz .subs a span{color:#9FC3AE}
@media (max-width:860px){.biz{grid-template-columns:1fr}.biz article{min-height:380px}}

/* deal cards */
.deal{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.deal:hover{border-color:var(--accent);box-shadow:0 10px 28px rgba(15,25,60,.08)}
.deal .top{display:flex;justify-content:space-between;gap:10px;padding:22px 24px 0;flex-wrap:wrap}
.deal .body{padding:16px 24px 20px;display:grid;gap:10px;flex:1;align-content:start}
.deal .no{font:500 12px var(--mono);color:var(--muted);letter-spacing:.08em}
.deal h3{font-size:19px}
.deal .pair{font-size:14.5px;color:var(--muted)}
.deal dl{margin:6px 0 0;display:grid;gap:0;border-top:1px solid var(--line)}
.deal dl div{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.deal dt{color:var(--muted)}
.deal dd{margin:0;font-weight:500}
.deal .size{font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--accent)}
.deal .go{padding:14px 24px;border-top:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--accent)}

/* track highlight */
.hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.hl a{text-decoration:none;background:var(--band);color:var(--band-fg);border-radius:14px;padding:32px;display:grid;gap:12px;align-content:start}
.hl .eyebrow{color:#9FC3AE}
.hl .num{font-size:clamp(52px,6vw,76px);font-weight:700;line-height:1;letter-spacing:-.03em}
.hl .num small{font-size:.32em;font-weight:500;margin-left:6px;letter-spacing:0}
.hl p{color:var(--band-muted)}
.hl .go{font-weight:700;color:#9FC3AE;font-size:14.5px}
@media (max-width:760px){.hl{grid-template-columns:1fr}}

.reach{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.reach .cty{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:2px solid var(--fg);margin-top:22px}
.reach .cty div{padding:16px 10px 0 0;display:grid;gap:2px}
.reach .cty b{font-size:15px}
.reach .cty span{font:500 12px var(--mono);color:var(--muted)}
@media (max-width:860px){.reach{grid-template-columns:1fr}}
@media (max-width:480px){.reach .cty{grid-template-columns:repeat(3,1fr);row-gap:12px}}

.ctaband{background:var(--band);color:var(--band-fg)}
.ctaband .wrap{padding-block:64px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.ctaband h2{font-size:clamp(22px,2.8vw,32px);max-width:20em}
.ctaband p{color:var(--band-muted);margin-top:8px}

/* ===== sub page header ===== */
.phead{position:relative;background:var(--band);color:var(--band-fg);overflow:hidden}
.phead .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28}
.phead .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--band) 30%,rgba(30,42,94,.4))}
.phead .wrap{position:relative;padding-block:64px 56px;display:grid;gap:12px}
.crumb{font-size:13px;color:var(--band-muted);display:flex;gap:8px;flex-wrap:wrap}
.crumb a{text-decoration:none}
.phead h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.02em}
.phead p{color:var(--band-muted);max-width:44em;font-size:16.5px}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 106px);z-index:20}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex-shrink:0;text-decoration:none;font-weight:500;font-size:15px;padding:16px 16px 14px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}

/* overview */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.about .ph{aspect-ratio:4/3}
.about h2{font-size:clamp(26px,3.2vw,36px);letter-spacing:-.02em;margin:10px 0 16px}
.about .lead{color:var(--muted);font-size:16.5px}
.divs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.divs div{border-top:2px solid var(--accent);padding-top:12px;display:grid;gap:4px}
.divs div.c2{border-color:var(--accent-2)}
.divs b{font-size:17px}
.divs span{font-size:14px;color:var(--muted)}
.facts3{display:grid;grid-template-columns:repeat(2,1fr);margin-top:24px;border-top:1px solid var(--line)}
.facts3 div{padding:14px 12px 0 0;display:grid}
.facts3 dt{font-size:13px;color:var(--muted)}
.facts3 dd{margin:0;font-weight:700;font-size:17px}
@media (max-width:860px){.about{grid-template-columns:1fr}}
@media (max-width:460px){.divs,.facts3{grid-template-columns:1fr}}

/* history (deck slide 5) */
.hist-sec{background:#E6EEF8;--hn:#1F2A5C;--ho:#EE7D2F;--hs:#12A3DA}
.tl5{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto 72px auto;column-gap:0;padding-left:150px;color:#1F2A5C}
.tl5-band{grid-row:3;grid-column:1 / -1;position:relative;margin-left:calc(-150px - max(20px,env(safe-area-inset-left,0px)));margin-right:-8px;background:#fff;clip-path:polygon(0 0,calc(100% - 44px) 0,100% 50%,calc(100% - 44px) 100%,0 100%);display:flex;align-items:center;padding-left:max(20px,env(safe-area-inset-left,0px))}
.tl5-band span{font-weight:700;font-size:clamp(18px,1.9vw,24px);color:var(--hs);letter-spacing:.01em}
.ev{position:relative;display:contents}
.ev .ev-txt,.ev .ev-pin,.ev .ev-dot{grid-column:calc(var(--i) + 1)}
.ev-txt{text-align:center;display:grid;gap:2px;align-content:end;padding:0 2px;min-width:0;z-index:1;width:200%;justify-self:center}
.ev-txt time{font-size:clamp(20px,2.1vw,28px);font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--c)}
.ev-txt b{font-size:clamp(11.5px,1.05vw,14.5px);font-weight:700;white-space:pre-line;line-height:1.45;color:#1F2A5C}
.ev.corp{--c:var(--hn)}.ev.adv{--c:var(--ho)}.ev.mkt{--c:var(--hs)}
.ev-pin{justify-self:center;width:clamp(84px,9vw,128px);aspect-ratio:1;position:relative;z-index:2}
.ev-pin::before{content:"";position:absolute;inset:0;background:var(--c);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.ev-in{position:absolute;inset:7%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ev-in img{max-width:62%;max-height:62%;object-fit:contain}
.ev-in.ny{background:#fff}.ev-in.ny img{max-width:78%;background:#111;padding:4px 5px;border-radius:3px}
.ev-in.photo img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover}
.ev-in.lg img{max-width:74%;max-height:60%}
.ev-in.mark img{max-width:58%;max-height:58%}
.ev-in.badge img{max-width:96%;max-height:96%}
.ev-in.trophy img{max-height:90%;max-width:90%}
.ev-dot{justify-self:center;align-self:center;width:18px;height:18px;border-radius:50%;background:var(--c);grid-row:2;z-index:2}
.ev.up .ev-txt{grid-row:1;padding-bottom:12px}
.ev.up .ev-pin{grid-row:1;align-self:end;margin-bottom:-30px;display:none}
.ev.dn .ev-pin::before{border-radius:50% 0 50% 50%;transform:rotate(-45deg)}
/* grid rows: 1 text-up, 2 pin-up, 3 band, 4 pin-dn, 5 text-dn */
.tl5{grid-template-rows:auto auto 72px auto auto}
.ev.up .ev-txt{grid-row:1}
.ev.up .ev-pin{grid-row:2;display:block;margin:6px 0 -22px}
.ev .ev-dot{grid-row:3}
.ev.dn .ev-pin{grid-row:4;margin:-22px 0 6px}
.ev.dn .ev-txt{grid-row:5;align-content:start;padding-top:12px}
.ev.up .ev-pin::before{border-radius:50% 50% 0 50%;transform:rotate(45deg)}
.ev.dn .ev-pin::before{border-radius:0 50% 50% 50%;transform:rotate(45deg)}
@media (max-width:900px){
 .tl5{display:block;padding-left:0}
 .tl5-band{position:static;clip-path:none;border-radius:8px;height:auto;padding:12px 16px;margin-bottom:18px}
 .ev{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:16px;padding:10px 0 10px 12px;position:relative}
 .ev .ev-txt,.ev .ev-pin{grid-column:auto;grid-row:auto!important;margin:0!important}
 .ev .ev-pin{width:76px;order:-1;display:block!important}
 .ev .ev-txt{text-align:left;padding:0!important;width:auto;justify-self:stretch;display:grid}
 .tl5-band{margin:0 0 18px!important;padding:14px 18px!important}
 .ev-dot{display:none}
 .ev.up .ev-pin::before,.ev.dn .ev-pin::before{border-radius:50% 50% 50% 0;transform:rotate(45deg)}
}

.grp{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}

:root[data-theme="dark"] .dot.hq{background:#F2F5FB}:root[data-theme="dark"] .dot.sub{border-color:#F2F5FB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dot.hq{background:#F2F5FB}:root:not([data-theme="light"]) .dot.sub{border-color:#F2F5FB}}

const ROUTES=["home","overview","history","organization","network","plant","equipment","parts","advisory","valuechain","track","deals","contact"];
let cur="home";
function render(keepScroll){
  const h=(location.hash||"#home").slice(1);
  let route=h,html;
  const m=/^deal-(\d+)$/.exec(h);
  if(m){route="deal";html=P.deal(+m[1])}
  else if(/^part-\w+$/.test(h)){route="part";html=P.part(h.slice(5))}
  else{if(!ROUTES.includes(h))route="home";html=P[route]()}
  cur=route;
  renderChrome(route);
  $("#app").innerHTML=html;
  $("#mnav").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");
  if(!keepScroll)window.scrollTo(0,0);
  bind(route);
}
function bind(route){
  clearInterval(heroTimer);
  if(route==="home"&&HERO.length>1){
    const show=i=>{heroIdx=(i+HERO.length)%HERO.length;document.querySelectorAll(".slide").forEach(s=>s.classList.toggle("on",+s.dataset.i===heroIdx));document.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current",+b.dataset.go===heroIdx));$("#hcnt").textContent=`0${heroIdx+1} / 0${HERO.length}`};
    show(heroIdx);
    document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(+b.dataset.go));
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const start=()=>{clearInterval(heroTimer);if(!heroPaused&&!reduce)heroTimer=setInterval(()=>show(heroIdx+1),6500)};
    $("#hpp").textContent=heroPaused||reduce?"▶":"❚❚";
    $("#hpp").onclick=()=>{heroPaused=!heroPaused;$("#hpp").textContent=heroPaused?"▶":"❚❚";start()};
    start();
  }
  document.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{partSel=b.dataset.part;const y=window.scrollY;render(true);window.scrollTo(0,y)});
  document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{dealFilter=b.dataset.filter;const y=window.scrollY;render(true);window.scrollTo(0,y)});
  document.querySelectorAll("[data-ask]").forEach(a=>a.onclick=()=>{askDeal=+a.dataset.ask});
  if(route==="contact")bindForm();
}
function bindForm(){
  const d=DEALS.find(a=>a.id===askDeal);
  if(d){$("#f-subj").value=`[CASE ${String(d.id).padStart(2,"0")}] ${x(d.title)}`;askDeal=null}
  $("#copyMail").onclick=e=>{const btn=e.currentTarget,txt=$("#mail").textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($("#mail"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent=x(F.copied)},sel)}catch(err){sel()}};
  const file=$("#f-file");
  file.onchange=()=>{const f=file.files[0];$("#fileName").textContent=f?f.name+" · "+(f.size/1048576).toFixed(1)+" MB":x(F.none);$("#e-file").textContent=""};
  $("#inq").onsubmit=ev=>{ev.preventDefault();let ok=true;
    const chk=(id,eid,cond,msg)=>{const el=$("#"+id),er=$("#"+eid);if(!cond){er.textContent=x(F[msg]);el.setAttribute("aria-invalid","true");ok=false}else{er.textContent="";el.removeAttribute("aria-invalid")}};
    const v=id=>$("#"+id).value.trim();
    chk("f-email","e-email",v("f-email")!=="","req");if(v("f-email"))chk("f-email","e-email",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("f-email")),"mail");
    chk("f-phone","e-phone",v("f-phone")!=="","req");chk("f-subj","e-subj",v("f-subj")!=="","req");chk("f-body","e-body",v("f-body")!=="","req");
    const f=file.files[0];chk("f-file","e-file",!f||f.size<=10485760,"size");chk("f-agree","e-agree",$("#f-agree").checked,"agree");
    const dn=$("#done");if(ok){dn.textContent=x(F.ok);dn.hidden=false}else{dn.hidden=true;const first=document.querySelector('[aria-invalid="true"]');if(first)first.focus()}};
}
document.querySelectorAll(".lang [data-l]").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;try{localStorage.setItem("smcc-lang",L)}catch(e){};render(true)}));
$("#burger").onclick=()=>{const o=$("#mnav").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
document.addEventListener("click",e=>{const b=e.target.closest(".mi > button");document.querySelectorAll(".mi.open").forEach(m=>{if(!b||m!==b.parentElement)m.classList.remove("open")});if(b)b.parentElement.classList.toggle("open");if(e.target.closest(".drop a"))document.querySelectorAll(".mi.open").forEach(m=>m.classList.remove("open"))});
document.addEventListener("visibilitychange",()=>{if(document.hidden)clearInterval(heroTimer);else if(cur==="home")bind("home")});
window.addEventListener("hashchange",()=>render(false));
try{const s=localStorage.getItem("smcc-lang");if(s&&["ko","en","zh","ja"].includes(s))L=s}catch(e){}
render(true);
</script>
</body>
</html>
